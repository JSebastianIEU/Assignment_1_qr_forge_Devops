name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  COVERAGE_GATE: 60

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite://
    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Run tests with coverage
        run: |
          coverage run -m pytest --junitxml=results.xml
          coverage xml -o coverage.xml

      - name: Enforce coverage threshold
        run: |
          coverage report --fail-under=${{ env.COVERAGE_GATE }}

  container-scan-smoke:
    name: Container build, Trivy scan and smoke tests
    runs-on: ubuntu-latest
    needs: test-and-lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: docker build -t qr_forge:ci .

      - name: Trivy scan (image)
        uses: aquasecurity/trivy-action@0.21.0
        with:
          image-ref: qr_forge:ci
          format: 'json'
          output: trivy-report.json
          severity: CRITICAL,HIGH

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json

      - name: Run container for smoke tests
        run: |
          docker run -d --name qrforge_ci -p 8000:8000 -e DATABASE_URL="sqlite:///tmp/qrcodes.db" qr_forge:ci
          retries=15
          while [ $retries -gt 0 ]; do
            if curl --silent --fail http://localhost:8000/health; then
              echo "health endpoint OK"
              break
            fi
            retries=$((retries-1))
            sleep 2
          done
          if [ $retries -le 0 ]; then
            echo "health endpoint did not become ready";
            docker logs qrforge_ci || true;
            exit 1
          fi
          curl --silent --fail http://localhost:8000/metrics | head -n 40

      - name: Stop and remove container
        if: always()
        run: |
          docker rm -f qrforge_ci || true

      # Container build, Trivy scan and smoke tests moved to dedicated job
      
