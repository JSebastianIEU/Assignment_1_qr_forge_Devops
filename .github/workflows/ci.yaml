name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Cache dependencies to speed up CI
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir coverage pytest

      - name: Lint (ruff) and format check (black)
        run: |
          pip install --no-cache-dir ruff black
          ruff check .
          black --check .

      - name: Run tests with coverage (minimum 70%)
        run: |
          pip install --no-cache-dir pytest-cov
          coverage run -m pytest --junitxml=tests/results.xml
          coverage xml -o coverage.xml
          coverage report --fail-under=70

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            coverage.xml
            tests/results.xml

      - name: Build Docker image (test only)
        run: docker build -t qr-app-ci .
      