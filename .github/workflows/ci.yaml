name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Cache dependencies to speed up CI
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt','requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          # Install test & lint tools from dev requirements for CI jobs
          if [ -f requirements-dev.txt ]; then pip install --no-cache-dir -r requirements-dev.txt; fi

      - name: Lint (ruff) and format check (black)
        run: |
          ruff check .
          black --check .

      - name: Run tests with coverage (minimum 70%)
        run: |
          coverage run -m pytest --junitxml=tests/results.xml
          coverage xml -o coverage.xml
          coverage report --fail-under=70

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            coverage.xml
            tests/results.xml

      - name: Build Docker image (test only)
        run: docker build -t qr-app-ci .

  autofix:
    name: Auto-format (manual)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements-dev.txt
      - name: Run ruff & black to auto-fix
        run: |
          ruff format . || true
          black . || true
      - name: Show status
        run: |
          echo "Auto-format completed. Review changes locally and commit if desired."
      