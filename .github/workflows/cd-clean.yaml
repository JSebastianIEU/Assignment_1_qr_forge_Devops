name: CD (clean)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure required secrets exist
        run: |
          if [ -z "${{ secrets.AZURE_CREDENTIALS }}" ] || [ -z "${{ secrets.ACR_NAME }}" ] || [ -z "${{ secrets.AZURE_RESOURCE_GROUP }}" ] || [ -z "${{ secrets.AZURE_WEBAPP_NAME }}" ] || [ -z "${{ secrets.AZURE_KEYVAULT_NAME }}" ]; then
            echo "Missing one of: AZURE_CREDENTIALS, ACR_NAME, AZURE_RESOURCE_GROUP, AZURE_WEBAPP_NAME, AZURE_KEYVAULT_NAME" >&2
            exit 1
          fi

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR Login
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build image with ACR build
        run: az acr build --registry ${{ secrets.ACR_NAME }} --image "${{ secrets.AZURE_WEBAPP_NAME }}:${{ env.IMAGE_TAG }}" .

      - name: Ensure staging slot exists
        run: az webapp deployment slot create --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --name ${{ secrets.AZURE_WEBAPP_NAME }} --slot staging || true

      - name: Set container image for staging slot
        run: |
          IMAGE="${{ secrets.ACR_NAME }}.azurecr.io/${{ secrets.AZURE_WEBAPP_NAME }}:${{ env.IMAGE_TAG }}"
          az webapp config container set --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --name ${{ secrets.AZURE_WEBAPP_NAME }} --slot staging --docker-custom-image-name "$IMAGE"

      - name: Run migrations from built image
        run: |
          IMAGE="${{ secrets.ACR_NAME }}.azurecr.io/${{ secrets.AZURE_WEBAPP_NAME }}:${{ env.IMAGE_TAG }}"
          az acr login --name ${{ secrets.ACR_NAME }}
          docker pull "$IMAGE"
          POSTGRES_URL=$(az keyvault secret show --vault-name "${{ secrets.AZURE_KEYVAULT_NAME }}" --name POSTGRES_URL --query value -o tsv)
          docker run --rm -e POSTGRES_URL="$POSTGRES_URL" "$IMAGE" alembic upgrade head || true

      - name: Wait for staging health and smoke test
        run: |
          HOST=$(az webapp show --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --name ${{ secrets.AZURE_WEBAPP_NAME }} --slot staging --query defaultHostName -o tsv)
          if [ -z "$HOST" ] || [ "$HOST" = "null" ]; then
            echo "Cannot determine staging host" >&2
            exit 1
          fi
          APP_URL="https://$HOST"
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$APP_URL/health" || echo "000")
            echo "Attempt $i: $status"
            if [ "$status" = "200" ]; then
              echo "Staging healthy"
              break
            fi
            sleep 5
          done
          if [ "$status" != "200" ]; then
            echo "Staging failed health check" >&2
            exit 1
          fi

      - name: Swap staging -> production
        run: az webapp deployment slot swap --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --name ${{ secrets.AZURE_WEBAPP_NAME }} --slot staging --target-slot production

      - name: Post deploy check
        run: |
          PROD_URL="https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          curl -f "$PROD_URL/health"
