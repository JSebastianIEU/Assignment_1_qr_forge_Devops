name: CD - Build & Deploy to ACI

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write
  actions: read

env:
  IMAGE_TAG: ${{ github.sha }}
  IMAGE_TAG_LATEST: latest

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit safety

      - name: Run Bandit (security linter)
        run: |
          bandit -r app/ -f json -o bandit-report.json || true
          bandit -r app/ -ll || echo "⚠️ Bandit found security issues"

      - name: Check dependencies for known vulnerabilities (Safety)
        run: |
          safety check --json > safety-report.json || true
          safety check || echo "⚠️ Safety found vulnerable dependencies"

      - name: Build Docker image for scanning
        run: |
          docker build -f infrastructure/docker/Dockerfile -t scan-image:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: scan-image:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
            trivy-results.sarif

  build-and-push:
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./src/frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./src/frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.API_URL || '/api' }}

      - name: Run frontend tests
        working-directory: ./src/frontend
        run: npm test -- --run

      - name: Run backend tests (pytest)
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest src/tests -v --tb=short

      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.AZURE_CREDENTIALS }}" ] || \
             [ -z "${{ secrets.ACR_NAME }}" ] || \
             [ -z "${{ secrets.ACR_PASSWORD }}" ] || \
             [ -z "${{ secrets.RESOURCE_GROUP }}" ] || \
             [ -z "${{ secrets.ACI_NAME }}" ] || \
             [ -z "${{ secrets.ACR_IMAGE_NAME }}" ] || \
             [ -z "${{ secrets.SECRET_KEY }}" ] || \
             [ -z "${{ secrets.POSTGRES_URL }}" ] || \
             [ -z "${{ secrets.DATABASE_URL }}" ] || \
             [ -z "${{ secrets.AZURE_STORAGE_CONTAINER }}" ]; then
            echo "Error: One or more required secrets not set" >&2
            echo "Required: AZURE_CREDENTIALS, ACR_NAME, ACR_PASSWORD, RESOURCE_GROUP, ACI_NAME, ACR_IMAGE_NAME, SECRET_KEY, POSTGRES_URL, DATABASE_URL, AZURE_STORAGE_CONTAINER" >&2
            exit 1
          fi
          echo "✓ All required secrets validated"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR Login
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build image locally
        run: |
          docker build -f infrastructure/docker/Dockerfile -t ${{ secrets.ACR_NAME }}.azurecr.io/${{ secrets.ACR_IMAGE_NAME }}:${{ env.IMAGE_TAG }} .
          docker tag ${{ secrets.ACR_NAME }}.azurecr.io/${{ secrets.ACR_IMAGE_NAME }}:${{ env.IMAGE_TAG }} ${{ secrets.ACR_NAME }}.azurecr.io/${{ secrets.ACR_IMAGE_NAME }}:${{ env.IMAGE_TAG_LATEST }}

      - name: Push image to ACR
        run: |
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/${{ secrets.ACR_IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/${{ secrets.ACR_IMAGE_NAME }}:${{ env.IMAGE_TAG_LATEST }}

      - name: Delete old ACI instance
        run: |
          az container delete --resource-group ${{ secrets.RESOURCE_GROUP }} --name ${{ secrets.ACI_NAME }} --yes || true

      - name: Deploy to ACI
        run: |
          az container create \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --name ${{ secrets.ACI_NAME }} \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/${{ secrets.ACR_IMAGE_NAME }}:${{ env.IMAGE_TAG_LATEST }} \
            --cpu 1 \
            --memory 1 \
            --registry-login-server ${{ secrets.ACR_NAME }}.azurecr.io \
            --registry-username ${{ secrets.ACR_NAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --ports 8000 \
            --dns-name-label qrforge-app-prod \
            --os-type Linux \
            --environment-variables \
              SECRET_KEY=${{ secrets.SECRET_KEY }} \
              ACCESS_TOKEN_EXPIRE_MINUTES=10080 \
              ALGORITHM=HS256 \
              POSTGRES_URL=${{ secrets.POSTGRES_URL }} \
              DATABASE_URL=${{ secrets.DATABASE_URL }} \
              AZURE_STORAGE_CONNECTION_STRING=${{ secrets.AZURE_STORAGE_CONNECTION_STRING }} \
              AZURE_STORAGE_CONTAINER=${{ secrets.AZURE_STORAGE_CONTAINER }} \
              QR_ASSETS_DIR=/home/app/data/qr_assets \
              QR_TEMP_DIR=/home/app/data/qr_temp \
              PYTHONUNBUFFERED=1 \
              WEBSITES_PORT=8000 \
              GITHUB_SHA=${{ github.sha }} \
              GITHUB_REF=${{ github.ref }}

      - name: Deployment summary
        run: |
          echo "✓ Image built and pushed: ${{ secrets.ACR_NAME }}.azurecr.io/${{ secrets.ACR_IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          echo "✓ Deployed to ACI: qrforge-app-prod.northeurope.azurecontainer.io:8000"

      - name: Run alembic migrations from built image
        run: |
          IMAGE="${{ secrets.ACR_NAME }}.azurecr.io/${{ secrets.ACR_IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          az acr login --name ${{ secrets.ACR_NAME }}
          docker pull "$IMAGE"
          docker run --rm --entrypoint "" -e POSTGRES_URL="${{ secrets.POSTGRES_URL }}" "$IMAGE" sh -c "alembic upgrade head"

      - name: Wait for ACI to be ready
        run: |
          echo "Waiting 30s for ACI to start..."
          sleep 30

      - name: Smoke test ACI endpoint
        run: |
          APP_URL="http://qrforge-app-prod.northeurope.azurecontainer.io:8000/health"
          echo "Checking $APP_URL"
          for i in $(seq 1 10); do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$APP_URL" || echo "000")
            echo "Attempt $i: $status"
            if [ "$status" = "200" ]; then
              echo "✓ ACI deployment healthy"
              exit 0
            fi
            sleep 10
          done
          echo "⚠️ Health check failed, but deployment may still be starting" >&2
          exit 0

      - name: Build HTTPS proxy image
        run: |
          docker build -f infrastructure/docker/Dockerfile.https-proxy -t ${{ secrets.ACR_NAME }}.azurecr.io/qrforge-https-proxy:latest .

      - name: Push proxy image to ACR
        run: |
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/qrforge-https-proxy:latest

      - name: Deploy HTTPS proxy to App Service
        run: |
          az webapp create \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --plan qrforge-proxy-plan \
            --name qrforge-https-proxy \
            --deployment-container-image-name ${{ secrets.ACR_NAME }}.azurecr.io/qrforge-https-proxy:latest || true
          
          az webapp config container set \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --name qrforge-https-proxy \
            --docker-custom-image-name ${{ secrets.ACR_NAME }}.azurecr.io/qrforge-https-proxy:latest \
            --docker-registry-server-url https://${{ secrets.ACR_NAME }}.azurecr.io \
            --docker-registry-server-user ${{ secrets.ACR_NAME }} \
            --docker-registry-server-password ${{ secrets.ACR_PASSWORD }}
          
          az webapp config appsettings set \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --name qrforge-https-proxy \
            --settings WEBSITES_PORT=8000

      - name: Test HTTPS proxy
        run: |
          PROXY_URL="https://qrforge-https-proxy.azurewebsites.net"
          echo "Waiting 30s for proxy to start..."
          sleep 30
          echo "Testing proxy at $PROXY_URL"
          for i in $(seq 1 10); do
            status=$(curl -s -o /dev/null -w "%{http_code}" -k --max-time 10 "$PROXY_URL" || echo "000")
            echo "Attempt $i: $status"
            if [ "$status" = "200" ]; then
              echo "✓ HTTPS proxy is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "⚠️ Proxy health check failed" >&2
          exit 0
