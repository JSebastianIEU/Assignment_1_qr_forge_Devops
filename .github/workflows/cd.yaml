name: CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure CLI login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validate Key Vault secret POSTGRES_URL exists
        run: |
          if ! az keyvault secret show --vault-name "${{ secrets.AZURE_KEYVAULT_NAME }}" --name POSTGRES_URL >/dev/null 2>&1; then
            echo "POSTGRES_URL secret missing in Key Vault ${{ secrets.AZURE_KEYVAULT_NAME }}"; exit 1
          fi

      - name: Build and push image to ACR
        run: |
          az acr build --registry ${{ secrets.ACR_NAME }} --image ${{ secrets.AZURE_WEBAPP_NAME }}:${IMAGE_TAG} .

      - name: Run Trivy scan on image
        run: |
          docker pull ${{ secrets.ACR_NAME }}.azurecr.io/${{ secrets.AZURE_WEBAPP_NAME }}:${IMAGE_TAG}
          docker tag ${{ secrets.ACR_NAME }}.azurecr.io/${{ secrets.AZURE_WEBAPP_NAME }}:${IMAGE_TAG} qrapp:scan
          trivy image -f json -o trivy-report.json qrapp:scan || true
        continue-on-error: true

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json

      - name: Ensure staging slot exists
        run: |
          az webapp deployment slot create --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --name ${{ secrets.AZURE_WEBAPP_NAME }} --slot staging || true

      - name: Deploy to staging slot (container)
        run: |
          az webapp config container set --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --name ${{ secrets.AZURE_WEBAPP_NAME }} --slot staging --docker-custom-image-name ${{ secrets.ACR_NAME }}.azurecr.io/${{ secrets.AZURE_WEBAPP_NAME }}:${IMAGE_TAG}

      - name: Run alembic migrations using image (local docker run)
        run: |
          POSTGRES_URL=$(az keyvault secret show --vault-name ${{ secrets.AZURE_KEYVAULT_NAME }} --name POSTGRES_URL --query value -o tsv)
          docker run --rm -e POSTGRES_URL="$POSTGRES_URL" ${{ secrets.ACR_NAME }}.azurecr.io/${{ secrets.AZURE_WEBAPP_NAME }}:${IMAGE_TAG} alembic upgrade head

      - name: Smoke test staging slot
        run: |
          HOST=$(az webapp show --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --name ${{ secrets.AZURE_WEBAPP_NAME }} --slot staging --query defaultHostName -o tsv)
          APP_URL="https://$HOST"
          echo "Health check $APP_URL/health"
          curl -f $APP_URL/health

      - name: Swap staging to production
        run: |
          az webapp deployment slot swap --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --name ${{ secrets.AZURE_WEBAPP_NAME }} --slot staging --target-slot production

      - name: Post-deploy verification
        run: |
          PROD_URL="https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          curl -f ${PROD_URL}/health
