name: CD

on:
  push:
    branches:
      - main   # Only runs on push to `main`
  workflow_dispatch: # allows manual runs from the Actions UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ACR_NAME: jsebastianacr
      IMAGE_NAME: qr-app
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate POSTGRES_URL secret exists
        run: |
          if [ -z "${{ secrets.POSTGRES_URL }}" ]; then
            echo "ERROR: POSTGRES_URL secret is not set. Aborting." >&2
            exit 1
          fi

      # Login to Azure using the Service Principal stored in your repository secrets
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Login to Azure Container Registry
      - name: ACR Login
        run: az acr login --name jsebastianacr

      # Build and Push Docker image
      - name: Build and Push Image
        run: |
          FULL_IMAGE="$ACR_NAME.azurecr.io/$IMAGE_NAME"

          echo "Building image $FULL_IMAGE:$IMAGE_TAG"
          docker build -t "$FULL_IMAGE:$IMAGE_TAG" .

          echo "Pushing image with tag: $IMAGE_TAG"
          docker push "$FULL_IMAGE:$IMAGE_TAG"

          echo "Tagging and pushing :latest"
          docker tag "$FULL_IMAGE:$IMAGE_TAG" "$FULL_IMAGE:latest"
          docker push "$FULL_IMAGE:latest"

      # SECURITY: Create Key Vault and store POSTGRES_URL as a secret (idempotent)
      - name: Ensure Key Vault and secret
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: |
          KV_NAME=kv-jsebastianqrapp
          RG=BCSAI2025-DEVOPS-STUDENTS-A
          LOCATION=westeurope
          # create vault if missing
          az keyvault show --name $KV_NAME --resource-group $RG >/dev/null 2>&1 || az keyvault create --name $KV_NAME --resource-group $RG --location $LOCATION --sku standard
          # store secret (from repo secret) in vault
          az keyvault secret set --vault-name $KV_NAME --name POSTGRES-URL --value "$POSTGRES_URL"

      # Assign Managed Identity to Web App and grant Key Vault access
      - name: Assign managed identity to webapp and grant Key Vault access
        run: |
          APP=jsebastianqrapp
          RG=BCSAI2025-DEVOPS-STUDENTS-A
          KV_NAME=kv-jsebastianqrapp
          # assign user-assigned identity to the webapp (if none, creates system assigned)
          az webapp identity assign --name $APP --resource-group $RG || true
          PRINCIPAL_ID=$(az webapp show --name $APP --resource-group $RG --query identity.principalId -o tsv)
          az keyvault set-policy --name $KV_NAME --object-id $PRINCIPAL_ID --secret-permissions get --no-wait || true

      # Configure App Setting to reference Key Vault secret (Key Vault Reference)
      - name: Configure App Service to use Key Vault reference for POSTGRES_URL
        run: |
          APP=jsebastianqrapp
          RG=BCSAI2025-DEVOPS-STUDENTS-A
          KV_NAME=kv-jsebastianqrapp
          # Use Key Vault reference syntax
          az webapp config appsettings set --name $APP --resource-group $RG --settings POSTGRES_URL="@Microsoft.KeyVault(VaultName=$KV_NAME;SecretName=POSTGRES-URL)"

      # Run DB migrations using the built image (safer: migrations run with same deps/code)
      - name: Validate POSTGRES_URL and run migrations inside image
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: |
          if [ -z "${POSTGRES_URL}" ]; then
            echo "ERROR: POSTGRES_URL secret is not set. Aborting migration step." >&2
            exit 1
          fi

          FULL_IMAGE="$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG"
          echo "Pulling image $FULL_IMAGE"
          docker pull "$FULL_IMAGE"

          echo "Running migrations inside container (one-shot)"
          docker run --rm -e POSTGRES_URL="${POSTGRES_URL}" "$FULL_IMAGE" alembic upgrade head


      # (Old venv-based migration step removed; migrations are executed from the built image)
      # Create staging slot (idempotent)
      - name: Ensure staging slot exists
        run: |
          APP=jsebastianqrapp
          RG=BCSAI2025-DEVOPS-STUDENTS-A
          az webapp deployment slot create --name $APP --resource-group $RG --slot staging || true

      # Deploy to staging slot first
      - name: Deploy to staging slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: "jsebastianqrapp"
          slot-name: "staging"
          images: "jsebastianacr.azurecr.io/qr-app:latest"

      - name: Smoke test staging slot
        run: |
          APP=jsebastianqrapp
          RG=BCSAI2025-DEVOPS-STUDENTS-A
          echo "== az account show (diagnostic) =="
          az account show || true
          echo "== az webapp show (diagnostic) for staging slot=="
          az webapp show --name $APP --resource-group $RG --slot staging -o json || true

          HOST=$(az webapp show --name $APP --resource-group $RG --slot staging --query defaultHostName -o tsv || true)
          if [ -z "$HOST" ] || [ "$HOST" = "null" ]; then
            echo "ERROR: could not discover staging host" >&2
            exit 1
          fi
          APP_URL="https://$HOST"
          echo "Waiting for $APP_URL/health"
          for i in {1..30}; do
            echo "Attempt #$i"
            body=$(curl -sSL --max-time 10 "$APP_URL/health" || true)
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$APP_URL/health" || echo "000")
            echo "HTTP status: $status"
            echo "Body: $body"
            if [ "$status" = "200" ] && echo "$body" | grep -q '"status"\s*:\s*"ok"'; then
              echo "Staging smoke test passed against $APP_URL"
              exit 0
            fi
            sleep 5
          done
          echo "Staging smoke test failed - final status: $status" >&2
          echo "Final body: $body" >&2
          exit 1

      # Swap staging into production on success
      - name: Swap staging into production
        run: |
          APP=jsebastianqrapp
          RG=BCSAI2025-DEVOPS-STUDENTS-A
          echo "Swapping staging -> production"
          az webapp deployment slot swap --resource-group $RG --name $APP --slot staging --target-slot production || (echo "Swap failed" >&2; exit 1)
