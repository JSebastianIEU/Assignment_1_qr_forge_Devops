name: CD

on:
  push:
    branches:
      - main   # Only runs on push to `main`
  workflow_dispatch: # allows manual runs from the Actions UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ACR_NAME: jsebastianacr
      IMAGE_NAME: qr-app
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate POSTGRES_URL secret exists
        run: |
          if [ -z "${{ secrets.POSTGRES_URL }}" ]; then
            echo "ERROR: POSTGRES_URL secret is not set. Aborting." >&2
            exit 1
          fi

      # Login to Azure using the Service Principal stored in your repository secrets
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Login to Azure Container Registry
      - name: ACR Login
        run: az acr login --name jsebastianacr

      # Build and Push Docker image
      - name: Build and Push Image
        run: |
          FULL_IMAGE="$ACR_NAME.azurecr.io/$IMAGE_NAME"

          echo "Building image $FULL_IMAGE:$IMAGE_TAG"
          docker build -t "$FULL_IMAGE:$IMAGE_TAG" .

          echo "Pushing image with tag: $IMAGE_TAG"
          docker push "$FULL_IMAGE:$IMAGE_TAG"

          echo "Tagging and pushing :latest"
          docker tag "$FULL_IMAGE:$IMAGE_TAG" "$FULL_IMAGE:latest"
          docker push "$FULL_IMAGE:latest"

      # Run DB migrations using the built image (safer: migrations run with same deps/code)
      - name: Validate POSTGRES_URL and run migrations inside image
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: |
          if [ -z "${POSTGRES_URL}" ]; then
            echo "ERROR: POSTGRES_URL secret is not set. Aborting migration step." >&2
            exit 1
          fi

          FULL_IMAGE="$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG"
          echo "Pulling image $FULL_IMAGE"
          docker pull "$FULL_IMAGE"

          echo "Running migrations inside container (one-shot)"
          docker run --rm -e POSTGRES_URL="${POSTGRES_URL}" "$FULL_IMAGE" alembic upgrade head


      # (Old venv-based migration step removed; migrations are executed from the built image)
      # Deploy to Azure Web App for Containers
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "jsebastianqrapp"
          images: "jsebastianacr.azurecr.io/qr-app:latest"

      - name: Smoke test deployed app
        run: |
          APP_URL="https://jsebastianqrapp.azurewebsites.net"
          echo "Waiting for $APP_URL/health"
          for i in {1..20}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" $APP_URL/health || true)
            body=$(curl -s $APP_URL/health || true)
            if [ "$status" = "200" ] && [ "$body" = '{"status":"ok"}' ]; then
              echo "Smoke test passed"
              exit 0
            fi
            sleep 5
          done
          echo "Smoke test failed" >&2
          exit 1
