global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'qr_forge_app'
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ['qr-forge:8000']

  - job_name: 'azure_webapp'
    kubernetes_sd_configs: []
    metrics_path: /metrics
    relabel_configs: []
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'qr_forge_app'
    static_configs:
      - targets: ['app:8000']
        labels:
          group: 'qr_forge'
    metrics_path: /metrics
